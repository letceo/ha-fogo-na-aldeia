name: Gerar index.html de produção

on:
  push:
    branches: [main]
    paths: ['jogo-dev.html']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Obter a tag mais recente
        id: tag
        run: echo "version=$(git describe --tags --abbrev=0)" >> "$GITHUB_OUTPUT"

      - name: Substituir @main pela tag
        run: |
          sed "s/ha-fogo-na-aldeia@main/ha-fogo-na-aldeia@${{ steps.tag.outputs.version }}/g" jogo-dev.html > index.html

      - name: Verificar que não sobrou @main
        run: "! grep -q 'ha-fogo-na-aldeia@main' index.html"

      - name: Guardar
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Gerar index.html (${{ steps.tag.outputs.version }})"
          git push
